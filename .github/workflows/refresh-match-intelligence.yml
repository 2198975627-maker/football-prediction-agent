name: Refresh due match intelligence

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-match-intelligence
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the protected cloud refresh endpoint
        env:
          APP_URL: ${{ secrets.FOOTBALL_APP_URL }}
          CRON_SECRET: ${{ secrets.FOOTBALL_CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Configure FOOTBALL_APP_URL and FOOTBALL_CRON_SECRET in repository Actions secrets."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 55 --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/refresh-match-intelligence"
